# Pipeline configuration. Defaults live in saliency_driving/config.py; any key
# omitted here falls back to them. Override the dataset per-run with --dataset.

dataset: NJUD
device: auto            # auto | cpu | cuda
seed: 42

paths:
  data: data
  results: results
  saliency_maps: results/saliency_maps
  detection_outputs: results/detection_outputs
  simulation_outputs: results/simulation_outputs
  tensorboard: results/tensorboard
  cmsalgan_ckpt: models/cmSalGAN.ckpt
  detector_best: models/detector_best.pt
  checkpoints: models/checkpoints

saliency:
  input_size: 224
  batch_size: 1

training:
  batch_size: 2
  epochs: 3
  lr: 1.0e-4
  num_workers: 0
  fusion_mode: attention        # attention | plain | none
  saliency_source: precomputed  # precomputed | gt | zero

detection:
  score_threshold: 0.5
  iou_threshold: 0.5
  min_box_area_fraction: 0.001

simulation:
  window: [640, 480]
  step_size: 5.0
  steps_per_frame: 15
  goal_radius: 12
  smoothing: 0.8
  goal_weight: 1.0
  saliency_weight: 2.2
  detection_weight: 3.5
